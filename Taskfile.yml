# Common commands. Bare `task` prints the menu; `task --list` is the generated view.
#
# Deploys are automatic: Workers Builds deploys every push to main from the connected
# repository. Everything here is a local check.
version: '3'

set: [errexit, pipefail]
silent: true

env:
  # cf reports usage by default, including which agent harness runs it.
  DO_NOT_TRACK: '1'

tasks:
  default:
    desc: Print the menu
    # ponytail: hand-maintained listing -- go-task can neither group nor annotate, so a new
    # task means a row below; menu-drift fails until it has one. `task --list` stays the
    # generated view.
    cmds:
      - |
        b= c= d= r=
        if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
          b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        fi
        group() { printf '\n%s   %s\n' "$c$1$r" "$d$2$r"; }
        row() {
          if [ ${#1} -le 26 ]; then printf '  %-26s %s\n' "$1" "$2"
          else printf '  %s\n  %-26s %s\n' "$1" '' "$2"; fi
          [ -z "${3:-}" ] || note "$3"
        }
        note() { printf '  %-26s %s\n' '' "$d$1$r"; }

        printf '\n%s   %s\n' "${b}proton-keysync${r}" "${d}pushes the keys Proton serves to public keyservers, from a button${r}"

        group checks 'offline, no credentials'
        row 'task check' 'Everything CI runs: types, format, tests, dry-run deploy' 'then this menu against the tasks, which CI does not run'
        row 'task typecheck' 'cf workers types && tsc --noEmit'
        row 'task test' 'vitest -- the sync against fake servers'
        row 'task fmt' 'Fix formatting in place (biome check --write)'

        group build 'writes files in the checkout'
        row 'task clean' 'Delete node_modules and .cloudflare; the next task rebuilds them' '.cloudflare is where the generated types and builds live'
        echo

  # Every public task has a desc and a menu row, and every row names a task. default and
  # help are the menu itself. Needs task and jq wherever lint runs.
  menu-drift:
    internal: true
    cmds:
      - |
        rows=$(grep -oE "row ['\"]task [^ '\"]+" '{{.ROOT_TASKFILE}}' | sed -E "s/^row ['\"]task //" || true)
        bad=$(task -t '{{.ROOT_TASKFILE}}' --list-all --json --no-status | jq -r --arg rows "$rows" '
          ($rows | split("\n") | map(select(. != ""))) as $r
          | [.tasks[] | select(.task != "default" and .task != "help")] as $t
          | ($t[] | select(.desc == "") | "task \(.task): no desc; describe it or mark it internal"),
            ($t[] | select(.task | IN($r[]) | not) | "task \(.task): no row in the menu"),
            ($r[] | select(IN($t[].task) | not) | "row task \(.): no such task")')
        [ -z "$bad" ] || { printf '%s\n' "$bad" >&2; exit 1; }

  installed:
    internal: true
    status: ['test -x node_modules/.bin/cf']
    cmds:
      - 'echo "node_modules is missing -- npm ci"'
      - npm ci

  check:
    desc: Everything CI runs - types, format, tests, dry-run deploy - then the menu against the tasks
    deps: [installed]
    cmds:
      - {task: typecheck}
      - npm run format
      - {task: test}
      - npx cf deploy --dry-run
      - {task: menu-drift}

  test:
    desc: vitest - the sync against fake servers
    deps: [installed]
    cmds: [npm test]

  typecheck:
    desc: cf workers types && tsc --noEmit
    deps: [installed]
    cmds: [npm run typecheck]

  fmt:
    desc: Fix formatting in place - biome check --write, no lint rules are enabled
    deps: [installed]
    cmds: [npm run format:fix]

  clean:
    desc: Delete node_modules and .cloudflare, where the generated types and builds live - the next task rebuilds
    cmds: [rm -rf node_modules .cloudflare]
